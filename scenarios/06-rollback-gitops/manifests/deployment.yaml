apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollback-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rollback-demo
  template:
    metadata:
      labels:
        app: rollback-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27     # lab: change to a non-existent tag to simulate a bad release
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
