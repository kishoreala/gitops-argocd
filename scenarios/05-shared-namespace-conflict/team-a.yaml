apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-team-a
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: https://github.com/kishoreala/gitops-argocd.git
    targetRevision: main
    path: scenarios/05-shared-namespace-conflict/manifests-a
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-shared      # team-b moves to lab-shared-b in the fix step
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
