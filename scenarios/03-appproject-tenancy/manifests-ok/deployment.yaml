apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-a-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-a-web
  template:
    metadata:
      labels:
        app: team-a-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
