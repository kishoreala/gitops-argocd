apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drift-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: https://github.com/kishoreala/gitops-argocd.git
    targetRevision: main
    path: scenarios/01-self-heal-drift/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-drift
  syncPolicy:
    automated:
      prune: true
      selfHeal: true        # step 2 flips this to false
    syncOptions:
      - CreateNamespace=true
  # Step 3: uncomment to let something else (e.g. an HPA) own replicas.
  # ignoreDifferences:
  #   - group: apps
  #     kind: Deployment
  #     jsonPointers:
  #       - /spec/replicas
